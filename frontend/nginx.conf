server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 40m;

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600s;       # flux temps réel (SSE)
    proxy_buffering off;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";   # fichiers versionnés par Vite
  }

  location / {
    add_header Cache-Control "no-cache";   # index.html toujours relu : jamais d'ancienne version en cache
    try_files $uri /index.html;     # application monopage
  }
}
